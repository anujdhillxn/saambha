# The checks from CLAUDE.md's "Before finishing" that run anywhere. The idle benchmark (desktop/bench) and
# the model comparison (tests/models.rs) need the desktop session, the models and a Claude login, so they
# stay on the machine; so do the tests of the real pi (tests/pi.rs), which skip themselves without it.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev meson ninja-build
      - uses: actions/cache@v4
        with:
          path: ~/.local/lib/libgtk4-layer-shell*
          key: gtk4-layer-shell-${{ hashFiles('scripts/gtk4-layer-shell.sh') }}
      - run: scripts/gtk4-layer-shell.sh
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: A CA for the apps to bundle (each machine makes its own)
        run: scripts/gen_certs.sh desktop
      - run: ./gradlew :core:testDebugUnitTest
        working-directory: android
