[package]
name = "saambha-desktop"
version = "0.1.0"
edition = "2024"
description = "The Saambha dot and its chat panel"

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
gdk4-x11 = { version = "=0.11.5", features = ["xlib"] }  # the windows' hints to X11 window managers
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
