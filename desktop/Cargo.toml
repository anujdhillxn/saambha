[package]
name = "saambha"
version = "0.1.0"
edition = "2024"
description = "Saambha: the server the phone, watch and hotkey talk to, and the dot and chat panel on the desktop"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "multipart", "query", "tokio", "ws"] }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
gdk4-x11 = { version = "=0.11.5", features = ["xlib"] }  # the windows' hints to X11 window managers
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }
libc = "=0.2.191"
log = { version = "=0.4.35", features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }  # Ollama, over plain HTTP
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"  # the hotkey's recordings, for whisper to read
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "=0.5.3", features = ["util"] }

[dev-dependencies]
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "=1.53.1", features = ["test-util"] }
tokio-tungstenite = "=0.29.0"  # the touchpad's WebSocket, as the apps open it

[[test]]
name = "models"  # how well the real agent models do the job: on demand, see tests/models.rs
harness = false
