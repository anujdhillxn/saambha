[package]
name = "saambha-desktop"
version = "0.1.0"
edition = "2024"
description = "The Saambha dot and its chat panel"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["time"] }
gtk = "=0.18.2"  # the GTK windows under Tauri's: layers, where they take clicks, and X11 window hints
